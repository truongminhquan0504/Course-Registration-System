{% load static %}
<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Đăng ký học phần{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/main.js' %}" defer></script>
</head>
<body>
<header class="topbar">
    <a class="brand" href="{% url 'registrations:course_list' %}">Course Registration</a>
    {% if user.is_authenticated %}
    <nav>
        <a href="{% url 'registrations:course_list' %}">Đăng ký môn</a>
        <a href="{% url 'registrations:schedule' %}">Thời khóa biểu</a>
        <form method="post" action="{% url 'logout' %}" class="inline-form">
            {% csrf_token %}<button type="submit" class="link-button">Đăng xuất</button>
        </form>
    </nav>
    {% endif %}
</header>
<main class="container">
    {% for message in messages %}
        <div class="message message-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
<footer class="footer">Hệ thống đăng ký tín chỉ</footer>
</body>
</html>
